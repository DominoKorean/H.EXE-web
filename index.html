<!doctype html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000"><title>하늘 그림틀 — 웹 복원</title></head>
<body>
  <main id="stage" aria-label="하늘 그림틀 2.3">
    <canvas id="screen" width="640" height="480" tabindex="0" aria-label="그림 작업 영역. F1 도움말, F10 차림표, 오른쪽 드래그로 범위 선택"></canvas>
    <div id="controls" aria-label="하늘 도구와 차림표"></div>
    <div id="fields"></div>
    <input id="ime" type="text" tabindex="-1" autocomplete="off" aria-label="그림에 쓸 글" spellcheck="false">
  </main>
  <dialog id="browser-dialog" aria-labelledby="browser-title" aria-describedby="browser-description">
    <header><span>하늘 웹 버전</span><button type="button" id="browser-close" aria-label="닫기">×</button></header>
    <h1 id="browser-title"></h1>
    <p id="browser-description"></p>
    <div id="browser-content"></div>
    <footer id="browser-actions"></footer>
  </dialog>
  <aside id="storage-notice" hidden>
    <span role="status">임시 보관을 사용할 수 없습니다. F2로 그림 파일을 저장하세요.</span>
    <button type="button" aria-label="임시 보관 안내 닫기">닫기</button>
  </aside>
  <div id="print-sheet"></div>
  <p id="loading" role="status">하늘 그림틀을 불러오고 있습니다…</p>
  <p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
  <input id="file" type="file" accept=".art,.pcx" hidden>
  <script type="module" src="/src/main.ts"></script>
</body></html>
